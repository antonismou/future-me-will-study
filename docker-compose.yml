# Study planner + self-hosted ntfy, πίσω από Nginx Proxy Manager (κοινό docker network, χωρίς ports στο host).
name: study

services:
  app:
    build: .
    image: study-app:latest
    container_name: study-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      NTFY_URL: http://ntfy          # εσωτερική διεύθυνση για αποστολή (ρυθμίζεται και από το dashboard)
    volumes:
      - study-data:/data
    depends_on:
      ntfy:
        condition: service_healthy
    networks: [proxy, internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: study-ntfy
    restart: unless-stopped
    command: serve
    user: "10002:10002"
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:?ορίστε NTFY_PUBLIC_URL στο .env}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ATTACHMENT_CACHE_DIR: ""
      TZ: Europe/Athens
    volumes:
      - ntfy-data:/var/lib/ntfy
    depends_on:
      ntfy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -q 'true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [proxy, internal]
    security_opt: ["no-new-privileges:true"]

  # Δίνει σωστά δικαιώματα στο volume του ntfy (τρέχει μία φορά ως root και τερματίζει).
  ntfy-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 10002:10002 /var/lib/ntfy"]
    volumes:
      - ntfy-data:/var/lib/ntfy
    restart: "no"
    network_mode: none

volumes:
  study-data:
  ntfy-data:

networks:
  internal:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_proxy}
