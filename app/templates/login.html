{% extends "base.html" %}
{% block title %}Σύνδεση{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Σύνδεση</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Χρήστης <input name="username" autocomplete="username" required autofocus></label>
    <label>Κωδικός <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Είσοδος</button>
  </form>
</section>
{% endblock %}
